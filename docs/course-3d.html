<title>AI Regatta en 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
:root{color-scheme:dark;--ink:#F8FAFC;--ink2:rgba(248,250,252,.72);--glass:rgba(15,23,42,.58);--line:rgba(255,255,255,.14);--accent:#C7EB00;--blue:#2563EB;--f:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
html,body{height:100%;margin:0;background:#0B1F2E;color:var(--ink);font:500 14px/1.45 var(--f);overflow:hidden}
#c{position:fixed;inset:0;display:block;width:100vw;height:100vh;touch-action:none}
.hud{position:fixed;z-index:2;pointer-events:none}
.hud>*{pointer-events:auto}
.glass{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px var(--line);border-radius:18px}
.top{top:max(12px,env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;padding:10px 14px}
.brand b{font:800 17px var(--f);letter-spacing:-.01em}.brand span{font-size:12px;color:var(--ink2)}
.clock{font:800 30px var(--f);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.leg{font-size:12px;color:var(--ink2);text-transform:uppercase;letter-spacing:.08em}
.ctl{display:flex;gap:6px;flex-wrap:wrap;padding:8px}
button{font:700 13px var(--f);color:var(--ink);background:rgba(255,255,255,.08);border:0;border-radius:999px;padding:8px 13px;cursor:pointer;box-shadow:inset 0 0 0 1px var(--line)}
button[aria-pressed="true"]{background:var(--accent);color:#0F172A;box-shadow:none}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rank{bottom:max(12px,env(safe-area-inset-bottom,0px));left:max(12px,env(safe-area-inset-left,0px));width:min(270px,calc(100vw - 24px));padding:10px 12px}
.rank #rk{display:flex;flex-direction:column}.rank h2{margin:0 0 6px;font:700 11px var(--f);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.row{display:grid;grid-template-columns:22px 14px minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 4px;border-radius:10px;cursor:pointer}
.row:hover,.row.on{background:rgba(255,255,255,.1)}
.row b{font:800 14px var(--f);font-variant-numeric:tabular-nums}.row i{width:12px;height:12px;border-radius:50%}
.row em{font-style:normal;font-weight:700}.row span{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.cams{bottom:max(12px,env(safe-area-inset-bottom,0px));right:max(12px,env(safe-area-inset-right,0px));padding:8px;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.cams small{font-size:11px;color:var(--ink2);padding:0 6px;max-width:190px}
.toast{top:50%;left:50%;transform:translate(-50%,-50%);padding:14px 20px;font:800 22px var(--f);text-align:center;opacity:0;transition:opacity .4s;pointer-events:none}
.toast.on{opacity:1}
.wind{display:flex;align-items:center;gap:10px;padding:10px 14px}
.wind svg{width:34px;height:34px}
@media (max-width:640px){.clock{font-size:24px}.brand span{display:none}.cams{left:max(12px,env(safe-area-inset-left,0px));flex-direction:row;justify-content:center;flex-wrap:wrap}.cams button{padding:7px 10px;font-size:12px}.cams small{display:none}.rank{bottom:calc(max(12px,env(safe-area-inset-bottom,0px)) + 58px);width:min(200px,calc(100vw - 24px));padding:8px 10px}.row{padding:2px 4px;font-size:12.5px}.row b{font-size:12.5px}.wind{display:none}}
</style>
<canvas id="c" aria-label="Course AI Regatta en 3D : six voiliers sur le parcours, vue animée"></canvas>
<div class="hud top">
  <div class="glass brand"><div><b>AI Regatta · 3D</b><br><span>Course simulée · Toulon · vue spectateur</span></div><div style="text-align:right"><div class="clock" id="clk">−1:00</div><div class="leg" id="leg">Procédure de départ</div></div></div>
  <div class="glass wind" title="Vent mesuré à la bouée au vent"><svg viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15" fill="none" stroke="rgba(255,255,255,.35)"/><path d="M17 6 V27 M11 20 L17 27 L23 20" stroke="#C7EB00" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg><div><b style="font:800 16px var(--f)">10,4 nœuds</b><br><span style="font-size:12px;color:var(--ink2)">vent du large, vers la plage</span></div></div>
  <div class="glass ctl" role="group" aria-label="Simulation"><button type="button" id="play" aria-label="Pause">❚❚</button><button type="button" data-sp="1" aria-pressed="false">×1</button><button type="button" data-sp="4" aria-pressed="true">×4</button><button type="button" data-sp="10" aria-pressed="false">×10</button><button type="button" id="restart">Recommencer</button></div>
</div>
<div class="hud glass rank"><h2>Classement</h2><div id="rk"></div></div>
<div class="hud glass cams" role="group" aria-label="Caméra"><button type="button" data-cam="lead" aria-pressed="true">Suivre la tête</button><button type="button" data-cam="boat" aria-pressed="false">Suivre un bateau</button><button type="button" data-cam="top" aria-pressed="false">Vue d’ensemble</button><small>Glissez pour tourner, molette ou deux doigts pour zoomer. Bateaux agrandis un peu plus de deux fois pour être visibles.</small></div>

<script>/* Moteur 3D AI Regatta (three.js r147, script classique) : AIR3D(canvas, api)

{const m=std('#C6B995',.95),a=new THREE.Mesh(new THREE.CylinderGeometry(30,34,16,8),m),b=new THREE.Mesh(new THREE.CylinderGeometry(14,15,14,8),m);a.position.set(-150,8,-320);b.position.set(-150,23,-320);a.castShadow=b.castShadow=true;scene.add(a,b)}

  g.fillStyle=col||'#0F172A';g.font=font;g.textBaseline='middle';g.fillText(txt,18,c.height/2+2);
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false,transparent:true,sizeAttenuation:false}));const k=(big?.00011:.0001)*(api.labelScale||1);sp.scale.set(w*k,c.height*k,1);sp.renderOrder=10;return sp}

  const ring=new THREE.Mesh(new THREE.RingGeometry(small?2.4:4,small?2.8:4.6,40),new THREE.MeshBasicMaterial({color:'#FFFFFF',transparent:true,opacity:.5,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.y=.35;g.add(ring);

const tri=pts=>{const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pts.flat(),3));g.computeVertexNormals();return g};
function makeBoat(T){const root=new THREE.Group(),heel=new THREE.Group();root.add(heel);const col=new THREE.Color(T.c);
  const add=(geo,mat,x,y,z)=>{const o=new THREE.Mesh(geo,mat);o.position.set(x,y,z);o.castShadow=true;heel.add(o);return o};

  add(new THREE.BoxGeometry(.12,.012,.8),std('#F8FAFC',.6),0,.13,0);
  add(new THREE.BoxGeometry(.012,.38,.08),std('#1E293B'),0,-.17,.02);
  const bulb=add(new THREE.SphereGeometry(.045,16,10),std('#334155'),0,-.37,.02);bulb.scale.set(1,1,3);
  add(new THREE.CylinderGeometry(.007,.009,1.6,8),new THREE.MeshStandardMaterial({color:'#E2E8F0',metalness:.6,roughness:.3}),0,.93,-.08);
  add(new THREE.BoxGeometry(.05,.03,.04),new THREE.MeshStandardMaterial({color:'#C7EB00',emissive:'#556B00'}),0,.15,.05);
  const sm=new THREE.MeshStandardMaterial({color:'#FFFFFF',roughness:.7,side:THREE.DoubleSide,transparent:true,opacity:.96});
  const main=new THREE.Group();main.position.set(0,.16,-.08);
  [new THREE.Mesh(tri([[0,.02,0],[0,1.55,0],[0,.06,.42]]),sm),new THREE.Mesh(tri([[0,.75,.012],[0,.95,.012],[0,.78,.21]]),new THREE.MeshStandardMaterial({color:col,side:THREE.DoubleSide}))].forEach(o=>{o.castShadow=true;main.add(o)});
  const boom=new THREE.Mesh(new THREE.CylinderGeometry(.006,.006,.44,6),std('#CBD5E1'));boom.rotation.x=Math.PI/2;boom.position.set(0,.06,.21);main.add(boom);heel.add(main);
  // foc : amure fixée à l'étrave, tête fixée sur l'étai en haut ; seul le point d'écoute pivote autour de l'étai
  const JT=new THREE.Vector3(0,.18,-.46),JH=new THREE.Vector3(0,1.36,-.1),JC=new THREE.Vector3(0,.2,-.14),JA=JH.clone().sub(JT).normalize();
  const jg=tri([[JT.x,JT.y,JT.z],[JH.x,JH.y,JH.z],[JC.x,JC.y,JC.z]]);const jib=new THREE.Mesh(jg,sm);jib.castShadow=true;heel.add(jib);
  const stay=new THREE.Line(new THREE.BufferGeometry().setFromPoints([JT,new THREE.Vector3(0,1.72,-.08)]),new THREE.LineBasicMaterial({color:'#94A3B8'}));heel.add(stay);
  root.scale.setScalar(K);scene.add(root);const lab=label(T.id,T.c);lab.position.y=2.1;lab.scale.multiplyScalar(3/K);root.add(lab);

function sync(){const s=api.getSim();if(s===simRef)return;simRef=s;boats.forEach(b=>{scene.remove(b.root);scene.remove(b.trail)});boats=s.boats.map(makeBoat)}
// écartement visuel : les bateaux étant agrandis, on les décale doucement à l'image quand ils se chevaucheraient (la course n'est pas modifiée)

  for(let it=0;it<3;it++)for(let a=0;a<n;a++)for(let b=a+1;b<n;b++){const ax=P[a].x+o[a][0],az=P[a].z+o[a][1],bx=P[b].x+o[b][0],bz=P[b].z+o[b][1];let dx=bx-ax,dz=bz-az,d=Math.hypot(dx,dz);

 for(let i=0;i<boats.length;i++){const m=boats[i],st=S[i],h=st.hdg*Math.PI/180,p=P[i].clone();p.x+=m.ox;p.z+=m.oz;

<script>
(function(){'use strict';
const SIM=(function(){
  const TEAMS=[{id:'FRA',name:'France',c:'#2F6BFF',f:1.12},{id:'ITA',name:'Italie',c:'#00C2A8',f:1.035},{id:'GBR',name:'Grande-Bretagne',c:'#E4002B',f:0.88},{id:'NED',name:'Pays-Bas',c:'#FF8C1A',f:1.0},{id:'SUI',name:'Suisse',c:'#1E293B',f:1.015},{id:'MON',name:'Monaco',c:'#B07CFF',f:0.985}];
  // Parcours n°3 du règlement : porte 1-2 (départ, porte, arrivée), bouée au vent 3, zone de pénalité P1-P2 près de la bouée 2
  const WW={x:-22,y:200},LW1={x:-22,y:0},LW2={x:22,y:0},PIN=LW1,SB=LW2,P1={x:30,y:6},P2={x:30,y:-6},ZONE=4;
  const DN1=200,UP2=200,DN2=200,TOTAL=200+DN1+UP2+DN2,D2R=Math.PI/180;
  function rnd(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

    const boats=TEAMS.map((tm,i)=>{
      const sx=-21+i*8.4+(r()-.5)*1.2,t0=(i===ocsI?-1.3:0.3+r()*6.5),f=tm.f*(0.95+r()*0.08),tackLen=16+r()*44;
      const vUp=1.36*f,vDn=1.78*f,segs=[];let t=t0,x=sx,y=0;
      const add=(x1,y1,v,leg,kind,ex)=>{const d=Math.hypot(x1-x,y1-y);if(d<.01)return;const mx=(x+x1)/2,lift=kind==='up'?1+0.06*Math.max(-1,Math.min(1,mx/40)):1,dt=d/(v*lift);segs.push({x0:x,y0:y,x1,y1,t0:t,t1:t+dt,leg,kind,...ex});t+=dt;x=x1;y=y1};
      const dwell=(dt,leg,kind,ex)=>{segs.push({x0:x,y0:y,x1:x,y1:y,t0:t,t1:t+dt,leg,kind,...ex});t+=dt};
      // Contournement : arc de cercle autour de la bouée, sens +1 (bouée à bâbord) ou -1 (à tribord)
      const arc=(C,R,a0,a1,v,leg,kind)=>{const n=Math.max(4,Math.ceil(Math.abs(a1-a0)/24));for(let k=1;k<=n;k++){const a=(a0+(a1-a0)*k/n)*D2R;add(C.x+R*Math.cos(a),C.y+R*Math.sin(a),v,leg,kind,{first:k===1,last:k===n,R})}};
      const radius=leg=>(i===touchI&&leg===touchLeg)?.5:1.6+r()*1.6;
      const beat=leg=>{let s=x>0?-1:(r()<.5?1:-1),g=0;const xl=-48+r()*10,xr=48-r()*10;const R=radius(leg);
        while(g++<40){const tx=Math.max(xl,Math.min(xr,x+s*(tackLen*(.7+r()*.6))));let px=x,py=y,hit=false;
          for(let k=0;k<400;k++){const nx=px+s*.5,ny=py+.5;
            if(s>0&&nx>0&&(WW.y-ny)<=nx+R*.7){px=nx;py=ny;hit=true;break}      // layline tribord atteinte en bâbord amures
            if(s<0&&nx<0&&(WW.y-ny)<=-nx*1.25){px=nx;py=ny;break}             // ne pas dépasser la layline bâbord
            if((s>0&&nx>=tx)||(s<0&&nx<=tx)){px=nx;py=ny;break}px=nx;py=ny}
          add(px,py,vUp,leg,'up');dwell(2.3,leg,'tack',{lay:hit});if(hit)break;s=-s}
        // tribord amures sur la layline, bouée laissée à bâbord : on passe au nord-est puis on abat en tournant à gauche
        add(WW.x+R*Math.cos(45*D2R),WW.y+R*Math.sin(45*D2R),vUp,leg,'up');
        arc(WW,R,45,200,vUp*.8,leg,'round')};
      const run=(leg,fin)=>{const g1=(r()<.5?-1:1)*(16+r()*16);add(g1,135+r()*15,vDn,leg,'dn');dwell(1.6,leg,'gybe');add(-g1*.8,70+r()*14,vDn,leg,'dn');dwell(1.6,leg,'gybe');
        if(fin){add((r()-.5)*28,-3,vDn,leg,'fin');return}
        const east=r()<.5,G=east?LW2:LW1,R=radius(leg);
        // on descend entre les deux bouées de la porte puis on remonte autour de celle choisie
        const sx2=east?G.x-R:G.x+R;add(sx2,G.y+7,vDn,leg,'dn');add(sx2,G.y,vDn*.9,leg,'dn');
        if(east)arc(G,R,180,360,vDn*.75,leg,'gate');else arc(G,R,0,-180,vDn*.75,leg,'gate')};
      beat(1);run(2,false);beat(3);run(4,true);
      const orders=[{te:t0,cmd:'Mode près',code:'mode_upwind',dom:'strat',why:'Départ : cap sur la bouée 3, côté du plan d’eau choisi avant le signal'}];
      segs.forEach(g=>{
        if(g.kind==='tack'){orders.push({te:g.t0,cmd:'Vire',code:'tack',dom:'strat',why:g.lay?'Layline tribord atteinte : la bouée sera droit devant':(g.x0>0?'Le vent a tourné à droite : l’autre bord fait gagner':'Bord gauche épuisé, retour vers la droite')});if(g.lay)orders.push({te:g.t1+.5,cmd:'Mode haut',code:'mode_high',dom:'tact',why:'Approche de la bouée : serrer le vent pour garder sa place'})}
        if(g.kind==='round'&&g.first)orders.push({te:g.t0,cmd:'Abats',code:'bear_away',dom:'tact',why:'Bouée 3 : on la laisse à bâbord en abattant'});
        if(g.kind==='round'&&g.last)orders.push({te:g.t1+.3,cmd:'Mode portant',code:'mode_downwind',dom:'perf',why:'Descente vers la porte : angle de meilleure vitesse vers la cible'});
        if(g.kind==='gybe')orders.push({te:g.t0,cmd:'Empanne',code:'gybe',dom:'perf',why:'Meilleur angle de descente sur l’autre bord'});
        if(g.kind==='gate'&&g.first)orders.push({te:g.t0,cmd:'Loffe',code:'head_up',dom:'tact',why:'Porte 1-2 : on la franchit et on remonte au vent'});
        if(g.kind==='gate'&&g.last)orders.push({te:g.t1+.3,cmd:'Mode près',code:'mode_upwind',dom:'perf',why:'Deuxième tour : vitesse cible au près'})});
      orders.push({te:segs[segs.length-1].t0,cmd:'Cap sur l’arrivée',code:'mode_downwind',dom:'strat',why:'Porte 1-2 : la ligne d’arrivée, par le chemin le plus court'});
      return {...tm,i,sx,t0,segs,orders,pens:[],ocs:i===ocsI,recalled:false,ev:{},fin:null};
    });
    avoid(boats,r);
    return {boats,events:[],alerts:[],log:[],flags:{}};
  }

  // Règle 10 : au près, le bateau bâbord amures s'écarte du bateau tribord amures, en abattant pour passer derrière, ou en virant.
  function reroute(b,tA,tB,plan,v){const S=b.segs,kA=S.findIndex(g=>tA>=g.t0&&tA<g.t1),kB=S.findIndex(g=>tB>=g.t0&&tB<g.t1);
    if(kA<0||kB<0||kB<kA)return 0;if(S.slice(kA,kB+1).some(g=>g.kind!=='up'&&g.kind!=='tack'))return 0;
    const pA=state(b,tA),pB=state(b,tB),gA=S[kA],gB=S[kB],leg=gA.leg,mid=[];let t=tA,x=pA.x,y=pA.y;
    const go=(x1,y1)=>{const d=Math.hypot(x1-x,y1-y);if(d<.01)return;mid.push({x0:x,y0:y,x1,y1,t0:t,t1:t+d/v,leg,kind:'up',avoid:true});t+=d/v;x=x1;y=y1};
    for(const q of plan){if(q.dwell){mid.push({x0:x,y0:y,x1:x,y1:y,t0:t,t1:t+q.dwell,leg,kind:'tack',avoid:true});t+=q.dwell}else go(q.x,q.y)}
    go(pB.x,pB.y);const delta=t-tB;
    const head=tA-gA.t0>.05?[{...gA,x1:pA.x,y1:pA.y,t1:tA}]:[],tail=[{...gB,x0:pB.x,y0:pB.y,t0:t,t1:gB.t1+delta}];
    b.segs=[...S.slice(0,kA),...head,...mid,...tail,...S.slice(kB+1).map(g=>({...g,t0:g.t0+delta,t1:g.t1+delta}))];
    b.orders.forEach(o=>{if(o.te>tA)o.te+=delta});return 1}
  function avoid(boats,r){const done=new Set(),end=Math.max(...boats.map(b=>b.segs[b.segs.length-1].t1))+60;
    for(let t=0;t<end;t+=.5){const st=boats.map(b=>state(b,t));
      for(let a=0;a<boats.length;a++)for(let c=0;c<boats.length;c++){if(a===c)continue;const A=st[a],C=st[c];
        if(A.fin||C.fin||A.seg!=='up'||C.seg!=='up'||A.leg!==C.leg||!(A.leg===1||A.leg===3))continue;
        if(tack(A.hdg)!=='bâbord'||tack(C.hdg)!=='tribord')continue;
        const key=a+'-'+c+'-'+A.leg;if(done.has(key))continue;
        let dmin=1e9,tc=t;for(let u=0;u<=8;u+=.25){const P=state(boats[a],t+u),Q=state(boats[c],t+u);if(P.seg!=='up'&&P.seg!=='tack')break;const d=Math.hypot(P.x-Q.x,P.y-Q.y);if(d<dmin){dmin=d;tc=t+u}}
        if(dmin>4)continue;done.add(key);if(tc-t<2)continue;
        const B=boats[a],Sb=boats[c],q=state(Sb,tc),hs=q.hdg*D2R,dx=Math.sin(hs),dy=Math.cos(hs),v=Math.max(.8,A.sog);
        let ok=0,mode='dip';
        if(tc-t>4.5&&r()<.5){mode='tack';const pA=state(B,t);ok=reroute(B,t,tc+7,[{dwell:2.3},{x:pA.x+dx*v*4.5,y:pA.y+dy*v*4.5},{dwell:2.3}],v)}
        if(!ok){mode='dip';ok=reroute(B,t,tc+5,[{x:q.x-dx*6,y:q.y-dy*6-2}],v*1.12)}
        if(ok){B.orders.push({te:t,cmd:mode==='tack'?'Vire':'Abats',code:mode==='tack'?'tack':'bear_away',dom:'tact',why:'Bâbord amures face à '+Sb.id+', tribord amures : '+(mode==='tack'?'on vire pour s’écarter (RCV 10)':'on abat pour passer derrière (RCV 10)')});
          if(mode==='tack')B.orders.push({te:t+2.3+4.5,cmd:'Vire',code:'tack',dom:'tact',why:'Route dégagée : retour sur le bord prévu'});
          B.avoids=(B.avoids||0)+1}}}}
  // Tour de pénalité du règlement : passer entre 2 et P1, contourner P2 puis P1 à bâbord, puis franchir l’arrivée
  function addLoop(b,t){const S=b.segs,L=S[S.length-1];if(L.kind!=='fin')return false;const te=effT(b,t);if(te>=L.t1)return false;
    const v=Math.hypot(L.x1-L.x0,L.y1-L.y0)/Math.max(.001,L.t1-L.t0),fx=L.x1,fy=L.y1;let x,y,tt;
    if(te<=L.t0){S.pop();x=L.x0;y=L.y0;tt=L.t0}else{const u=(te-L.t0)/(L.t1-L.t0);x=L.x0+(L.x1-L.x0)*u;y=L.y0+(L.y1-L.y0)*u;L.x1=x;L.y1=y;L.t1=te;tt=te}
    const add=(x1,y1,kind,vv,ex)=>{const d=Math.hypot(x1-x,y1-y);if(d<.01)return;const dt=d/(vv||v);S.push({x0:x,y0:y,x1,y1,t0:tt,t1:tt+dt,leg:4,kind,...ex});tt+=dt;x=x1;y=y1};
    const arc=(C,a0,a1)=>{const n=8;for(let k=1;k<=n;k++){const a=(a0+(a1-a0)*k/n)*D2R;add(C.x+4*Math.cos(a),C.y+4*Math.sin(a),'penloop',v*.75,{first:k===1})}};
    add(26,14,'penloop',v,{start:true});add(26,P2.y,'penloop',v*.9);arc(P2,180,360);add(P1.x+4,P1.y,'penloop',v*.9);arc(P1,0,180);add(fx,fy,'fin',v);
    b.loops=(b.loops||0)+1;return true}
  function effT(b,t){let e=t;for(const p of b.pens)if(t>p.at)e-=Math.min(t-p.at,p.dur);return e}
  function activePen(b,t){return b.pens.find(p=>p.dur>0.5&&t>=p.at&&t<p.at+p.dur)}
  const W=.35;
  // Avant le départ : boucle elliptique (le cap suit toujours la route), puis approche courbe vers la ligne
  function pre(b,t){const ang=W*(t-b.t0+12),cx=b.sx,cy=-14;return {x:cx+2.6*Math.cos(ang),y:cy+2.4*Math.sin(ang),hdg:Math.atan2(-2.6*Math.sin(ang),2.4*Math.cos(ang))/D2R,sog:1.2}}
  function state(b,t){
    if(t<b.t0-12){const p=pre(b,t);return {...p,leg:0,fin:false,seg:'pre'}}
    if(t<b.t0){const u=(t-(b.t0-12))/12,P0=[b.sx+2.6,-14],P1=[b.sx+2.6,-6],P2=[b.sx,0],m=1-u;
      const x=m*m*P0[0]+2*m*u*P1[0]+u*u*P2[0],y=m*m*P0[1]+2*m*u*P1[1]+u*u*P2[1],dx=2*m*(P1[0]-P0[0])+2*u*(P2[0]-P1[0]),dy=2*m*(P1[1]-P0[1])+2*u*(P2[1]-P1[1]);
      return {x,y,hdg:Math.atan2(dx,dy)/D2R,leg:0,sog:1.3,fin:false,seg:'pre'}}
    const S=b.segs,last=S[S.length-1],te=effT(b,t);
    if(te>=last.t1)return {x:last.x1,y:last.y1,hdg:180,leg:5,sog:0,fin:true,seg:'fin'};
    let k=0;while(k<S.length-1&&te>=S[k].t1)k++;
    const g=S[k],u=(te-g.t0)/Math.max(.001,g.t1-g.t0),still=g.x0===g.x1&&g.y0===g.y1;
    const H=s=>Math.atan2(s.x1-s.x0,s.y1-s.y0)/D2R;
    let hdg;if(still){const a=S[k-1]?H(S[k-1]):0,c=S[k+1]?H(S[k+1]):a,d=((c-a+540)%360)-180;hdg=a+d*u}else hdg=H(g);
    const p=activePen(b,t);if(p&&p.kind==='turn')hdg+=360*(t-p.at)/p.dur;else if(p&&p.kind==='stop')hdg=0;else if(p&&p.kind==='recall')hdg=180;
    const sog=still||p?.4:Math.hypot(g.x1-g.x0,g.y1-g.y0)/(g.t1-g.t0);
    return {x:g.x0+(g.x1-g.x0)*u,y:g.y0+(g.y1-g.y0)*u,hdg,leg:g.leg,sog,fin:false,seg:p?'pen':g.kind};
  }
  function tack(h){h=((h%360)+360)%360;return h<180?'bâbord':'tribord'}
  function remain(s){if(s.fin)return -1;if(s.leg===0)return TOTAL+20;if(s.leg===1)return (WW.y-s.y)+DN1+UP2+DN2;if(s.leg===2)return s.y+UP2+DN2;if(s.leg===3)return (WW.y-s.y)+DN2;return Math.max(0,s.y)}
  function ranking(sim,t){return sim.boats.map(b=>{const st=state(b,t);return {b,st,rem:remain(st)}}).sort((a,c)=>{if(a.st.fin&&c.st.fin)return a.b.fin-c.b.fin;if(a.st.fin)return -1;if(c.st.fin)return 1;return a.rem-c.rem})}
  // Instant d'entrée dans la zone de 4 m (null si le bateau n'y est pas)
  function zoneEntry(b,M,t){const d=tt=>{const s=state(b,tt);return Math.hypot(s.x-M.x,s.y-M.y)};if(d(t)>=ZONE)return null;let tt=t;while(tt>t-30&&d(tt-.1)<ZONE)tt-=.1;return tt}
  return {TEAMS,WW,LW1,LW2,PIN,SB,P1,P2,ZONE,TOTAL,build,effT,activePen,state,remain,ranking,tack,zoneEntry,addLoop};
})();
const $=s=>document.querySelector(s);
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const fmt=t=>{const s=Math.abs(t),m=Math.floor(s/60),r=Math.floor(s%60);return (t<0?'−':'')+m+':'+String(r).padStart(2,'0')};
const LEGN=['Procédure de départ','Tour 1 · au près','Tour 1 · au portant','Tour 2 · au près','Tour 2 · au portant','Arrivée'];
let seed=7,sim=SIM.build(seed),T=-60,speed=4,playing=!RM,camMode='lead',follow='FRA',lastTxt='';
const E=AIR3D($('#c'),{SIM,getSim:()=>sim,getT:()=>T,controls:true});
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.k);toast.k=setTimeout(()=>el.classList.remove('on'),2200)}
function setCam(m){camMode=m;document.querySelectorAll('[data-cam]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.cam===m)));if(m==='boat')E.follow(follow);else E.setMode(m)}
function hud(){$('#clk').textContent=fmt(T);const rk=SIM.ranking(sim,T);$('#leg').textContent=LEGN[Math.min(5,rk[0].st.leg)];
  const box=$('#rk');rk.forEach((q,i)=>{let r=box.querySelector(`[data-b="${q.b.id}"]`);
    if(!r){r=document.createElement('div');r.className='row';r.dataset.b=q.b.id;r.setAttribute('role','button');r.tabIndex=0;r.innerHTML=`<b></b><i style="background:${q.b.c}"></i><em>${q.b.name}</em><span></span>`;box.appendChild(r)}
    r.style.order=i;r.classList.toggle('on',camMode==='boat'&&follow===q.b.id);r.children[0].textContent=T<0?'–':i+1;r.children[3].textContent=q.st.fin?'arrivé':Math.max(0,q.rem).toFixed(0)+' m'});
  let txt='';if(T>=-60&&T<-58)txt='Départ dans 1 minute';else if(T>=0&&T<2.5)txt='C’est parti !';else{const f=sim.boats.filter(b=>b.fin!=null&&T>=b.fin&&T<b.fin+3)[0];if(f)txt=f.name+(sim.boats.filter(b=>b.fin!=null&&b.fin<=f.fin).length===1?' gagne la course !':' arrive')}
  if(txt&&txt!==lastTxt)toast(txt);lastTxt=txt}
$('#rk').addEventListener('click',e=>{const r=e.target.closest('[data-b]');if(r){follow=r.dataset.b;setCam('boat')}});$('#rk').addEventListener('keydown',e=>{const r=e.target.closest('[data-b]');if(r&&(e.key==='Enter'||e.key===' ')){e.preventDefault();follow=r.dataset.b;setCam('boat')}});
document.querySelectorAll('[data-cam]').forEach(b=>b.addEventListener('click',()=>setCam(b.dataset.cam)));
document.querySelectorAll('[data-sp]').forEach(b=>b.addEventListener('click',()=>{speed=+b.dataset.sp;document.querySelectorAll('[data-sp]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}));
$('#play').addEventListener('click',()=>{playing=!playing;$('#play').textContent=playing?'❚❚':'▶';$('#play').setAttribute('aria-label',playing?'Pause':'Lecture')});
$('#restart').addEventListener('click',()=>{seed=(seed*31+7)%9973;sim=SIM.build(seed);T=-60;lastTxt='';$('#rk').innerHTML=''});
if(!playing){$('#play').textContent='▶';$('#play').setAttribute('aria-label','Lecture')}
let last=performance.now(),acc=0;
function loop(now){const dt=Math.min(.1,(now-last)/1000);last=now;if(playing&&T<1500)T+=dt*speed;E.frame(dt);acc+=dt;if(acc>.25){acc=0;hud()}requestAnimationFrame(loop)}
hud();requestAnimationFrame(loop);
window.__race={get T(){return T},set T(v){T=v}};
})();
</script>
