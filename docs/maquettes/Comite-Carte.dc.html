<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Comité · Carte tactique</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@400;500;600;700&amp;family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#C7EB00}a:hover{color:#F7F8F2}
</style>
</helmet>
<div style="width:1440px;height:900px;box-sizing:border-box;background:#081615;color:#F7F8F2;font-family:'Instrument Sans',system-ui,sans-serif;display:grid;grid-template-columns:minmax(0,1fr) 340px">
  <div style="position:relative;overflow:hidden">
    <svg viewBox="0 0 1100 900" width="1100" height="900" role="img" aria-label="Carte tactique : vent par cases colorées selon sa force, flèches de direction, traces des bateaux, laylines et zones" style="position:absolute;inset:0">
      <rect width="1100" height="900" fill="#0A2422"/>
      <sc-if value="{{showWind}}" hint-placeholder-val="{{ true }}">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="20">
          <g>
            <rect x="{{c.x}}" y="{{c.y}}" width="100" height="100" fill="{{c.fill}}"/>
            <g transform="translate({{c.cx}} {{c.cy}}) rotate({{c.rot}})"><line x1="0" y1="-18" x2="0" y2="18" stroke="rgba(247,248,242,.55)" stroke-width="2"/><path d="M0 18 l-6 -9 h12 z" fill="rgba(247,248,242,.55)"/></g>
          </g>
        </sc-for>
      </sc-if>
      <path d="M120 70 H980 V860 H120 Z" fill="none" stroke="rgba(247,248,242,.4)" stroke-width="2" stroke-dasharray="8 8"/>
      <sc-if value="{{showZones}}" hint-placeholder-val="{{ true }}">
        <circle cx="560" cy="150" r="70" fill="rgba(199,235,0,.06)" stroke="rgba(199,235,0,.6)" stroke-dasharray="5 6"/>
        <circle cx="520" cy="760" r="60" fill="rgba(199,235,0,.06)" stroke="rgba(199,235,0,.6)" stroke-dasharray="5 6"/><circle cx="600" cy="760" r="60" fill="none" stroke="rgba(199,235,0,.6)" stroke-dasharray="5 6"/>
      </sc-if>
      <sc-if value="{{showLay}}" hint-placeholder-val="{{ true }}">
        <line x1="560" y1="150" x2="260" y2="560" stroke="#F7F8F2" stroke-opacity=".45" stroke-width="2" stroke-dasharray="12 8"/>
        <line x1="560" y1="150" x2="880" y2="560" stroke="#F7F8F2" stroke-opacity=".45" stroke-width="2" stroke-dasharray="12 8"/>
        <text x="270" y="585" style="font:500 13px 'JetBrains Mono',monospace" fill="rgba(247,248,242,.75)">layline bâbord (vent officiel)</text>
      </sc-if>
      <line x1="380" y1="830" x2="760" y2="800" stroke="#F7F8F2" stroke-width="2" stroke-dasharray="10 7"/>
      <circle cx="560" cy="150" r="12" fill="#D0704A" stroke="#F7F8F2" stroke-width="3"/><text x="580" y="146" style="font:700 14px 'JetBrains Mono',monospace">B3 · 10,4 nds</text>
      <circle cx="520" cy="760" r="10" fill="#D0704A" stroke="#F7F8F2" stroke-width="3"/><circle cx="600" cy="760" r="10" fill="#D0704A" stroke="#F7F8F2" stroke-width="3"/>
      <sc-for list="{{boats}}" as="b" hint-placeholder-count="7">
        <g>
          <sc-if value="{{b.showTrail}}" hint-placeholder-val="{{ true }}"><path d="{{b.trail}}" fill="none" stroke="{{b.c}}" stroke-width="{{b.tw}}" stroke-opacity=".75" stroke-linecap="round"/></sc-if>
          <g transform="translate({{b.x}} {{b.y}}) rotate({{b.rot}})"><path d="M0 -16 L9 11 L0 6 L-9 11 Z" fill="{{b.c}}" stroke="{{b.ring}}" stroke-width="{{b.rw}}"/></g>
          <text x="{{b.lx}}" y="{{b.ly}}" style="font:700 13px 'JetBrains Mono',monospace" fill="#F7F8F2">{{b.code}}</text>
        </g>
      </sc-for>
      <g><circle cx="572" cy="178" r="22" fill="none" stroke="#F1A27E" stroke-width="3"/><text x="600" y="200" style="font:700 13px 'JetBrains Mono',monospace" fill="#F1A27E">incident +03:36</text></g>
    </svg>

    <div style="position:absolute;left:20px;top:20px;display:flex;gap:10px;align-items:center">
      <span style="padding:10px 16px;border-radius:12px;background:rgba(6,16,15,.85);font:700 18px 'Funnel Display',sans-serif">AI Regatta <span style="color:#C7EB00">· Comité</span></span>
      <span style="padding:10px 16px;border-radius:12px;background:rgba(6,16,15,.85);font:700 18px 'JetBrains Mono',monospace">{{clock}}</span>
    </div>
    <div role="group" aria-label="Calques" style="position:absolute;left:20px;top:84px;display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:14px;background:rgba(6,16,15,.85)">
      <sc-for list="{{layers}}" as="l" hint-placeholder-count="4">
        <button type="button" onClick="{{l.go}}" aria-pressed="{{l.on}}" style="display:flex;align-items:center;gap:8px;min-height:40px;padding:6px 12px;border:0;border-radius:10px;background:{{l.bg}};color:#F7F8F2;font:600 13px 'Instrument Sans',sans-serif;cursor:pointer"><span style="width:12px;height:12px;border-radius:3px;background:{{l.dot}}"></span>{{l.label}}</button>
      </sc-for>
    </div>
    <div style="position:absolute;left:20px;bottom:20px;display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;background:rgba(6,16,15,.88)">
      <span style="font:600 12px 'JetBrains Mono',monospace;color:rgba(247,248,242,.7)">VENT</span>
      <span style="width:180px;height:12px;border-radius:6px;background:linear-gradient(90deg,#1F4E7A,#2E8C7E,#8FD18A,#C7EB00,#E8B04A)"></span>
      <span style="font:500 12px 'JetBrains Mono',monospace">8 → 13 nds</span>
    </div>
    <div role="group" aria-label="Rejeu" style="position:absolute;right:20px;bottom:20px;display:flex;align-items:center;gap:6px;padding:8px;border-radius:14px;background:rgba(6,16,15,.88)">
      <span style="padding:0 8px;font:600 12px 'JetBrains Mono',monospace;color:rgba(247,248,242,.7)">REJEU</span>
      <sc-for list="{{times}}" as="t" hint-placeholder-count="4">
        <button type="button" onClick="{{t.go}}" aria-pressed="{{t.on}}" style="min-height:40px;padding:6px 12px;border:0;border-radius:10px;background:{{t.bg}};color:{{t.fg}};font:600 13px 'JetBrains Mono',monospace;cursor:pointer">{{t.label}}</button>
      </sc-for>
    </div>
  </div>

  <aside aria-label="Flotte et bateau sélectionné" style="display:flex;flex-direction:column;gap:12px;padding:20px;background:#0D1A18;border-left:1px solid rgba(247,248,242,.08);min-height:0">
    <b style="font:600 20px 'Funnel Display',sans-serif">Flotte</b>
    <div style="display:flex;flex-direction:column;gap:4px">
      <sc-for list="{{boats}}" as="b" hint-placeholder-count="7">
        <button type="button" onClick="{{b.pick}}" aria-pressed="{{b.on}}" style="display:grid;grid-template-columns:24px 8px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:42px;padding:6px 10px;border-radius:10px;border:1px solid {{b.border}};background:{{b.bg}};color:#F7F8F2;cursor:pointer;font:500 13px 'Instrument Sans',sans-serif;text-align:left">
          <b style="font:700 15px 'Funnel Display',sans-serif">{{b.pos}}</b><span style="width:8px;height:22px;border-radius:3px;background:{{b.c}}"></span><span>{{b.name}}</span><span style="font:500 12px 'JetBrains Mono',monospace;color:{{b.fixC}}">{{b.fix}}</span>
        </button>
      </sc-for>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:16px;background:rgba(247,248,242,.05);box-shadow:inset 0 0 0 1px rgba(247,248,242,.1)">
      <div style="display:flex;justify-content:space-between;align-items:center"><b style="font:700 22px 'Funnel Display',sans-serif">{{cur.name}}</b><span style="width:14px;height:14px;border-radius:50%;background:{{cur.c}}"></span></div>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
        <sc-for list="{{cur.stats}}" as="s" hint-placeholder-count="6">
          <div style="padding:8px 10px;border-radius:10px;background:rgba(247,248,242,.05)"><span style="display:block;font:500 11px 'JetBrains Mono',monospace;color:rgba(247,248,242,.6)">{{s.k}}</span><b style="font:700 17px 'JetBrains Mono',monospace">{{s.v}}</b></div>
        </sc-for>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <a href="Comite-Course.dc.html" style="display:inline-flex;align-items:center;min-height:40px;padding:6px 12px;border-radius:10px;background:#C7EB00;color:#06100F;text-decoration:none;font:600 13px 'Instrument Sans',sans-serif">Ouvrir l’arbitrage</a>
        <a href="Comite-Messages.dc.html" style="display:inline-flex;align-items:center;min-height:40px;padding:6px 12px;border-radius:10px;border:1px solid rgba(247,248,242,.25);color:#F7F8F2;text-decoration:none;font:600 13px 'Instrument Sans',sans-serif">Écrire à l’équipe</a>
      </div>
    </div>
    <div style="margin-top:auto;padding:14px;border-radius:14px;background:rgba(199,235,0,.1);font-size:13px;line-height:1.45"><b style="color:#C7EB00">Bascule en cours</b> · +6° à droite en 10 min. Si elle continue, la bouée au vent sera à déplacer vers 134° avant la course 4.</div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { wind: true, trails: true, lay: true, zones: true, t: 3, sel: 'SUI' }; }
  renderVals() {
    const st = this.state;
    const pal = ['#1F4E7A','#2E8C7E','#8FD18A','#C7EB00','#E8B04A'];
    const cells = [];
    for (let i = 0; i < 11; i++) for (let j = 0; j < 9; j++) {
      const v = 9 + 0.28 * i + 0.12 * j + 0.6 * Math.sin(i * 0.9 + j * 0.6);
      const k = Math.max(0, Math.min(4, Math.round((v - 8.5) / 1.1)));
      cells.push({ x: i * 100, y: j * 100, cx: i * 100 + 50, cy: j * 100 + 50, fill: pal[k] + '33', rot: 300 + 2 * i - j });
    }
    const f = [0.55, 0.7, 0.85, 1][st.t];
    const D = [
      ['FRA','France','#C7EB00',1,'RTK fixe',[520,830],[540,186],192],
      ['ITA','Italie','#43B3A3',2,'RTK fixe',[640,820],[592,196],188],
      ['GBR','Grande-Bretagne','#B8902F',3,'RTK fixe',[700,815],[640,250],185],
      ['NED','Pays-Bas','#E0B4E8',4,'RTK fixe',[760,800],[850,330],160],
      ['SUI','Suisse','#D0704A',5,'RTK flottant',[440,830],[440,380],25],
      ['MON','Monaco','#6E8BD6',6,'RTK fixe',[400,835],[300,520],30],
      ['GER','Allemagne','#2F3A22',7,'radio 2 Hz',[480,835],[250,640],35]
    ];
    const boats = D.map(d => {
      const x = Math.round(d[5][0] + (d[6][0] - d[5][0]) * f), y = Math.round(d[5][1] + (d[6][1] - d[5][1]) * f);
      const mx = Math.round((d[5][0] + x) / 2 + (d[0] === 'SUI' || d[0] === 'MON' || d[0] === 'GER' ? -120 : 120));
      const on = st.sel === d[0];
      return { code: d[0], name: d[1], c: d[2], pos: d[3], fix: d[4], fixC: d[4] === 'RTK fixe' ? '#8FD18A' : '#F1A27E',
        x, y, rot: d[7], lx: x + 16, ly: y - 12, trail: 'M' + d[5][0] + ' ' + d[5][1] + ' Q' + mx + ' ' + Math.round((d[5][1] + y) / 2) + ' ' + x + ' ' + y,
        showTrail: st.trails, tw: on ? 4 : 2.5, ring: on ? '#F7F8F2' : '#06100F', rw: on ? 3 : 2,
        on: String(on), bg: on ? 'rgba(199,235,0,.12)' : 'transparent', border: on ? '#C7EB00' : 'rgba(247,248,242,.08)', pick: () => this.setState({ sel: d[0] }) };
    });
    const sel = D.find(d => d[0] === st.sel);
    const stats = { FRA: ['3,1 nds','2,6','312°','0 m','—','0'], SUI: ['3,0 nds','2,4','035°','12 m','+9,8 s','0'] }[sel[0]] || ['2,8 nds','2,3','040°','25 m','+6 s','0'];
    const cur = { name: sel[1] + ' · ' + sel[0], c: sel[2], stats: [ { k: 'VITESSE', v: stats[0] }, { k: 'VMG', v: stats[1] }, { k: 'CAP', v: stats[2] }, { k: 'À LA LAYLINE', v: stats[3] }, { k: 'ÉCART', v: stats[4] }, { k: 'PÉNALITÉS', v: stats[5] } ] };
    const L = (key, label, dot) => ({ label, dot, on: String(st[key]), bg: st[key] ? 'rgba(199,235,0,.16)' : 'transparent', go: () => this.setState({ [key]: !st[key] }) });
    const layers = [ L('wind','Vent','#8FD18A'), L('trails','Traces','#43B3A3'), L('lay','Laylines','#F7F8F2'), L('zones','Zones 3 longueurs','#C7EB00') ];
    const times = ['−60 s','−30 s','−10 s','Direct'].map((l, i) => ({ label: l, on: String(st.t === i), bg: st.t === i ? '#C7EB00' : 'rgba(247,248,242,.08)', fg: st.t === i ? '#06100F' : '#F7F8F2', go: () => this.setState({ t: i }) }));
    const clocks = ['+02:41','+03:11','+03:31','+03:41'];
    return { cells, boats, cur, layers, times, clock: clocks[st.t], showWind: st.wind, showLay: st.lay, showZones: st.zones };
  }
}
</script>
</body>
</html>
